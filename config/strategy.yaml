meta:
  version: v1.1-2026-10-26
  effective_date: 2026-10-26
  note: >
    v1.1（2026-10-26，第二批改造，用户工作流纲领第1/3步）：①模块A
    市场环境硬闸——判定只读母板字段（B31/放行E14/B79，workbook_map
    抽取）三态：允许进攻/谨慎交易（B31是+未放行+B79是，套母板验证期
    系数0.5与总仓位上限0.3）/禁止新开仓（B31否，或未放行且B79否；
    含先卖后买换仓豁免）；数据缺失/映射过期 fail-closed 降级禁开。
    ②模块B BUY 仓位改风险定仓 v2（数量=风险预算÷每股风险；每股风险
    =止损距离+往返成本（费率+滑点+最低收费摊算），止损距离=
    max(入场−母板stop_ref, 2×ATR)；总仓位/现金（含费）/风险簇预算4%
    （同板块∪近60日corr>0.8）/换仓额度封顶；止损无效、数据缺失、
    缩量后不足一手一律禁单），仅对信号日 ≥2026-10-26 的新信号生效，
    此前信号沿用 v1.0 口径（buy_frac），历史 fills 逐笔不变。毕业
    样本按 strategy_version 隔离：v1.1 起算的新成交与 v1.0 分开统计。
    v1.0 口径摘要：T+1开盘撮合+ATR止损(2x)+净盈亏+策略版本隔离。
    ③2026-10-27 补齐①（机制收紧，strategy_version 不变）：换仓豁免
    由"历史卖出毛额资金池"改为额度券制——仅主动卖出按扣费后净回收
    生券、一券一买、5 个交易日有效、被动止损不生券、券仓位卖出不
    再生券、环境闸 degraded 时禁用；口径实现见 engine/rotation.py。
