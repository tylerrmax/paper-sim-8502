sizing:
  # buy_frac 仅为 legacy 口径：信号日 <2026-10-26 的旧信号沿用
  # （历史不可改写）；≥2026-10-26 的新信号一律风险定仓 v2，不读此值
  buy_frac: 0.5
signals:
  strategy: buyback
  per_account:
    sim_a: buyback
    sim_hk: disabled
    sim_crypto: disabled
  ma_windows:
  - 5
  - 10
  - 20
  # 口径实述（P2-10 纠偏）：sim_a 实际执行 per_account 的 buyback——
  # 20 日高点回落 10% 生成 BUY、+15% 止盈 / -5% 止损（见 engine/signals.py
  # gen_buyback_signals）；且 BUY 执行须过母板止损禁入闸（engine/risk_gate.py）。
  # entry/exit 的 MA20 穿越仅为已停用策略（sim_hk/sim_crypto 的前身口径）：
  entry: disabled 账户前身口径：close > ma20（现 sim_hk/sim_crypto 已 disabled，不再生效）
  exit: disabled 账户前身口径：close < ma20（现 sim_hk/sim_crypto 已 disabled，不再生效）
risk:
  single_trade_risk_pct: 2
  max_stock_position_pct: 70
  max_crypto_position_pct: 100
  atr_stop_mult: 2.0
  # 风险簇预算（模块B v2）：同 sector_key 或近60日收益 corr>0.8 的
  # 持仓（取并集）存量未实现风险 + 本笔风险 ≤ 净值 × 4%，超出按比例
  # 缩量，缩到 0 不买并禁单留痕（日报 blocked_signals 列明）
  sector_risk_budget_pct: 4
fees:
