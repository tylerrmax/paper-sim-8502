name: Auto Update Quant Data

on:
  schedule:
    - cron: '0 10,14 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas requests openpyxl PyYAML

      - name: Run Crawler & Update Data Script
        run: |
          export NIGHTLY_CMD="python run_daily.py"
          bash tools/nightly_run.sh

      - name: Commit and Push New Data to GitHub
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GH_PAT }}
          branch: master
